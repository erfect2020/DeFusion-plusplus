DEVICE          : cuda              # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR        : 'outputtest'         # output folder name used for saving the model, logs and inference results

MODEL:
  NAME          : UCMIMNetV2                                            # name of the model you are using
  BACKBONE      : UCMIMNetV2                                         # model variant
  PRETRAINED    : 'checkpoints/pretrained/cumae/cumae_0.pth'     # backbone model's weight
  RESUME        : ''                                                # checkpoint file 

DATASET:
  NAME          : AdeDataset                                          # dataset name to be trained with (camvid, cityscapes, ade20k)
  ROOT          : '/home/lpw/Documents/fusion-dataset/ADEChallengeData2016'                                   # dataset root path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'thermal']

TRAIN:
  IMAGE_SIZE    : [480, 480]      # training image size in (h, w)
  BATCH_SIZE    : 3               # batch size used to train
  EPOCHS        : 50             # number of epochs to train
  EVAL_START    : 25              # evaluation interval during training
  EVAL_INTERVAL : 1               # evaluation interval during training
  AMP           : false           # use AMP in training
  DDP           : true            # use DDP training

LOSS:
  NAME          : CrossEntropy     # loss function name (ohemce, ce, dice)
  CLS_WEIGHTS   : false            # use class weights in loss calculation

OPTIMIZER:
  NAME          : adamw           # optimizer name
  LR            : 0.0002          # initial learning rate used in optimizer
  WEIGHT_DECAY  : 0.05            # decay rate used in optimizer

SCHEDULER:
  NAME          : warmuppolylr    # scheduler name
  POWER         : 0.9             # scheduler power
  WARMUP        : 1               # warmup epochs used in scheduler
  WARMUP_RATIO  : 0.01             # warmup ratio
  

EVAL:
  MODEL_PATH    : 'output/MFNet/cumae_seg_best.pth'
  IMAGE_SIZE    : [480, 480]      # evaluation image size in (h, w)
  BATCH_SIZE    : 2               # batch size used to train
  MSF: 
    ENABLE      : false                                   # multi-scale and flip evaluation  
    FLIP        : true                                    # use flip in evaluation  
    SCALES      : [0.5, 0.75, 1.0, 1.25, 1.5, 1.75]       # scales used in MSF evaluation                
